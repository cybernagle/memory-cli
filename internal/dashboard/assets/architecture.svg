<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- dependency arrow: caller -> callee -->
    <marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <!-- unified write chokepoint arrow -->
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
    <!-- query path arrow -->
    <marker id="qflow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    .layer-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .layer-label { font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
    .layer-sub { font-size: 10.5px; fill: #64748b; }
    .pkg { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .pkg-label { font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .pkg-sub { font-size: 10px; fill: #64748b; text-anchor: middle; }
    .pkg-core { fill: #eff6ff; stroke: #3b82f6; }
    .pkg-leaf { fill: #f0fdf4; stroke: #22c55e; }
    .pkg-new { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.6; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12.5px; fill: #64748b; }
    .note { font-size: 10.5px; fill: #475569; }
    .note-ok { font-size: 10.5px; fill: #15803d; font-weight: 600; }
    .badge-ok { font-size: 11px; fill: #15803d; font-weight: 700; }
  </style>

  <!-- Title -->
  <text x="40" y="36" class="title">memory-cli · 分层架构</text>
  <text x="40" y="56" class="subtitle">依赖方向自底向上（⑤ 依赖 ①-④）；★ = fan-in ≥ 5 的核心包。✅ 四个混乱点已全部关闭（①澄清 / ②③④ 收敛）。</text>

  <!-- Layer ⑤ composition root -->
  <rect x="40" y="78" width="1100" height="78" rx="8" class="layer-bg"/>
  <text x="56" y="98" class="layer-label">⑤ COMPOSITION ROOT · 组装层</text>
  <text x="56" y="112" class="layer-sub">cobra 入口，imports 14 个 internal 包做依赖注入；只做 wiring，不含领域逻辑（命令清理后 18 个）</text>
  <rect x="200" y="104" width="780" height="42" rx="6" class="pkg"/>
  <text x="590" y="125" class="pkg-label">cmd · 18 子命令（search/read/write/list/delete/serve/mcp/dashboard …）</text>
  <text x="590" y="139" class="pkg-sub">已删 10 个废弃/重复命令（dream/decay/agent/consolidate/process/upgrade/link 等）</text>

  <!-- Layer ④ orchestration -->
  <rect x="40" y="172" width="1100" height="120" rx="8" class="layer-bg"/>
  <text x="56" y="192" class="layer-label">④ ORCHESTRATION · 编排层</text>
  <text x="56" y="206" class="layer-sub">调度 / 协议适配 · 不含领域规则</text>

  <rect x="90" y="220" width="220" height="58" rx="6" class="pkg"/>
  <text x="200" y="244" class="pkg-label">daemon ★</text>
  <text x="200" y="261" class="pkg-sub">6 task：consolidate / enrich /</text>
  <text x="200" y="273" class="pkg-sub">profile / entity / evidence / reminder</text>

  <rect x="330" y="220" width="220" height="58" rx="6" class="pkg"/>
  <text x="440" y="244" class="pkg-label">api</text>
  <text x="440" y="261" class="pkg-sub">HTTP 接口 · makro push 写入</text>
  <text x="440" y="273" class="pkg-sub">+ JSON-RPC</text>

  <rect x="570" y="220" width="220" height="58" rx="6" class="pkg"/>
  <text x="680" y="244" class="pkg-label">mcp</text>
  <text x="680" y="261" class="pkg-sub">stdio JSON-RPC · 8 tool</text>
  <text x="680" y="273" class="pkg-sub">ask/search/write/read/delete…</text>

  <rect x="810" y="220" width="220" height="58" rx="6" class="pkg"/>
  <text x="920" y="244" class="pkg-label">transport</text>
  <text x="920" y="261" class="pkg-sub">Unix socket 长连接</text>
  <text x="920" y="273" class="pkg-sub">agent tool 调用</text>

  <!-- Layer ③ domain -->
  <rect x="40" y="308" width="1100" height="170" rx="8" class="layer-bg"/>
  <text x="56" y="328" class="layer-label">③ DOMAIN · 领域层</text>
  <text x="56" y="342" class="layer-sub">记忆的语义加工：捕获 / 提取 / 实体 / 问答 · ①已澄清（processor/factprocessor 正交，非重复）</text>

  <!-- capture -->
  <rect x="60" y="358" width="130" height="58" rx="6" class="pkg"/>
  <text x="125" y="382" class="pkg-label">ingest ★</text>
  <text x="125" y="399" class="pkg-sub">捕获适配器</text>
  <text x="125" y="411" class="pkg-sub">claude/zcode/car</text>

  <!-- plugin contract -->
  <rect x="205" y="358" width="130" height="58" rx="6" class="pkg pkg-core"/>
  <text x="270" y="382" class="pkg-label" fill="#1d4ed8">plugin ★</text>
  <text x="270" y="399" class="pkg-sub">管线契约</text>
  <text x="270" y="411" class="pkg-sub">PipelineEngine</text>

  <!-- two orthogonal processors -->
  <rect x="350" y="358" width="150" height="58" rx="6" class="pkg pkg-core"/>
  <text x="425" y="380" class="pkg-label" fill="#1d4ed8">factprocessor</text>
  <text x="425" y="397" class="pkg-sub">可插拔管线组件</text>
  <text x="425" y="409" class="pkg-sub">plugin.Component</text>

  <rect x="515" y="358" width="150" height="58" rx="6" class="pkg pkg-core"/>
  <text x="590" y="380" class="pkg-label" fill="#1d4ed8">processor</text>
  <text x="590" y="397" class="pkg-sub">进度追踪引擎</text>
  <text x="590" y="409" class="pkg-sub">StatusTracker/SSE</text>

  <!-- NEW: internal/query (chaos point ④ convergence) -->
  <rect x="680" y="358" width="150" height="58" rx="6" class="pkg pkg-new"/>
  <text x="755" y="380" class="pkg-label" fill="#047857">query ✦</text>
  <text x="755" y="397" class="pkg-sub" fill="#047857">查询理解（共用）</text>
  <text x="755" y="409" class="pkg-sub">intent/keyword/snippet</text>

  <!-- entity -->
  <rect x="845" y="358" width="130" height="58" rx="6" class="pkg"/>
  <text x="910" y="382" class="pkg-label">entity</text>
  <text x="910" y="399" class="pkg-sub">实体抽取/解析</text>
  <text x="910" y="411" class="pkg-sub">EntityResolver</text>

  <!-- dashboard + agent -->
  <rect x="990" y="358" width="135" height="58" rx="6" class="pkg"/>
  <text x="1057" y="380" class="pkg-label">dashboard + agent</text>
  <text x="1057" y="397" class="pkg-sub">问答编排/智能搜索</text>
  <text x="1057" y="409" class="pkg-sub">都调 query ✦</text>

  <text x="755" y="438" class="note-ok" text-anchor="middle">✦ 新增 internal/query：dashboard 与 mcp 共用同一份查询理解逻辑（混乱点④ 已收敛）</text>

  <!-- Layer ② core storage -->
  <rect x="40" y="488" width="1100" height="108" rx="8" class="layer-bg"/>
  <text x="56" y="508" class="layer-label">② CORE · 存储核心层</text>
  <text x="56" y="522" class="layer-sub">被 12 个包依赖。IngestMemory 是统一写入咽喉点（混乱点② 已收敛）；versioning.go 承载版本跟踪</text>

  <rect x="120" y="530" width="420" height="56" rx="6" class="pkg pkg-core"/>
  <text x="330" y="551" class="pkg-label" fill="#1d4ed8">store · SqliteStore ★（fan-in 12）</text>
  <text x="330" y="568" class="pkg-sub">CRUD · Search/SearchLike/FTS · IngestMemory（统一写入）</text>
  <text x="330" y="580" class="pkg-sub">entity_search.go = 搜索 · versioning.go = 版本跟踪（CheckAndSupersede）</text>

  <rect x="560" y="530" width="280" height="56" rx="6" class="pkg pkg-new"/>
  <text x="700" y="551" class="pkg-label" fill="#047857">IngestMemory = 唯一写入咽喉点 ✦</text>
  <text x="700" y="568" class="pkg-sub">Write/WriteToInbox/processor 全部经此</text>
  <text x="700" y="580" class="pkg-sub">提交后触发 supersede（版本跟踪副作用）</text>

  <!-- Layer ① foundation -->
  <rect x="40" y="612" width="1100" height="92" rx="8" class="layer-bg"/>
  <text x="56" y="632" class="layer-label">① FOUNDATION · 叶子层（零内部依赖）</text>
  <text x="56" y="646" class="layer-sub">纯基础设施，不含任何领域概念</text>

  <rect x="120" y="654" width="200" height="40" rx="6" class="pkg pkg-leaf"/>
  <text x="220" y="679" class="pkg-label" fill="#15803d">config</text>

  <rect x="345" y="654" width="200" height="40" rx="6" class="pkg pkg-leaf"/>
  <text x="445" y="679" class="pkg-label" fill="#15803d">llm ★（fan-in 8）</text>

  <rect x="570" y="654" width="200" height="40" rx="6" class="pkg pkg-leaf"/>
  <text x="670" y="679" class="pkg-label" fill="#15803d">notify</text>

  <rect x="795" y="654" width="200" height="40" rx="6" class="pkg pkg-leaf"/>
  <text x="895" y="679" class="pkg-label" fill="#15803d">health</text>

  <!-- DATA FLOW: write path (unified chokepoint) -->
  <rect x="40" y="722" width="545" height="128" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
  <text x="56" y="742" class="layer-label" fill="#0369a1">数据流 ▸ 写入路径（蓝）</text>
  <text x="56" y="757" class="note">所有写入经 IngestMemory 单一咽喉点，supersede 自动触发（混乱点② 已收敛）</text>

  <rect x="60" y="770" width="110" height="30" rx="5" fill="#fff" stroke="#0ea5e9"/>
  <text x="115" y="790" class="pkg-sub" text-anchor="middle" fill="#0369a1">ingest/api/mcp</text>
  <rect x="60" y="806" width="110" height="30" rx="5" fill="#fff" stroke="#0ea5e9"/>
  <text x="115" y="826" class="pkg-sub" text-anchor="middle" fill="#0369a9">daemon/processor</text>

  <line x1="170" y1="785" x2="258" y2="798" stroke="#0ea5e9" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="170" y1="821" x2="258" y2="812" stroke="#0ea5e9" stroke-width="2" marker-end="url(#flow)"/>

  <rect x="262" y="772" width="150" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="337" y="794" class="pkg-label" fill="#047857">IngestMemory ✦</text>
  <text x="337" y="811" class="pkg-sub">唯一咽喉点</text>
  <text x="337" y="823" class="pkg-sub">+ supersede 副作用</text>

  <line x1="412" y1="802" x2="478" y2="802" stroke="#0ea5e9" stroke-width="2" marker-end="url(#flow)"/>

  <rect x="480" y="784" width="95" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="527" y="807" class="pkg-sub" text-anchor="middle" fill="#1d4ed8" font-weight="600">store ★</text>

  <!-- DATA FLOW: query path (shared internal/query) -->
  <rect x="600" y="722" width="540" height="128" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="616" y="742" class="layer-label" fill="#15803d">数据流 ▸ 查询路径（绿）</text>
  <text x="616" y="757" class="note">dashboard 与 mcp 共用 internal/query（混乱点④ 已收敛），不再各写一份</text>

  <rect x="616" y="772" width="110" height="30" rx="5" fill="#fff" stroke="#16a34a"/>
  <text x="671" y="792" class="pkg-sub" text-anchor="middle" fill="#15803d">mcp</text>
  <rect x="616" y="806" width="110" height="30" rx="5" fill="#fff" stroke="#16a34a"/>
  <text x="671" y="826" class="pkg-sub" text-anchor="middle" fill="#15803d">dashboard</text>

  <line x1="726" y1="787" x2="794" y2="798" stroke="#16a34a" stroke-width="2" marker-end="url(#qflow)"/>
  <line x1="726" y1="821" x2="794" y2="812" stroke="#16a34a" stroke-width="2" marker-end="url(#qflow)"/>

  <rect x="798" y="772" width="120" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="858" y="794" class="pkg-label" fill="#047857">query ✦</text>
  <text x="858" y="811" class="pkg-sub">intent/keyword</text>
  <text x="858" y="823" class="pkg-sub">snippet（共用）</text>

  <line x1="918" y1="802" x2="978" y2="802" stroke="#16a34a" stroke-width="2" marker-end="url(#qflow)"/>

  <rect x="980" y="784" width="145" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1052" y="807" class="pkg-sub" text-anchor="middle" fill="#1d4ed8" font-weight="600">store ★ (Search)</text>
</svg>
