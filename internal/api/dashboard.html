<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Dashboard</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3348;--text:#e4e6f0;--text2:#8b8fa8;--primary:#6c8aff;--green:#4ade80;--orange:#fbbf24;--red:#f87171;--purple:#a78bfa;--cyan:#22d3ee;--c1:#161b22;--c2:#0e4429;--c3:#006d32;--c4:#26a641;--c5:#39d353}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--primary);cursor:pointer}

/* Nav */
.nav{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50}
.nav h1{font-size:16px;font-weight:600;white-space:nowrap}
.nav h1 span{color:var(--primary)}
.nav-tabs{display:flex;gap:2px;margin-left:12px}
.nav-tab{padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text2);background:none;border:none;white-space:nowrap}
.nav-tab:hover{background:var(--surface2)}
.nav-tab.active{background:var(--primary);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.dot-green{background:var(--green)}
.dot-red{background:var(--red)}

.main{padding:20px;max-width:1200px;margin:0 auto}
.page{display:none}
.page.active{display:block}

/* Status bar */
.status-bar{display:flex;gap:10px;margin-bottom:16px}
.status-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px}
.status-card .label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.status-card .value{font-size:18px;font-weight:700;margin-top:2px}

/* Heatmap */
.heatmap-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px}
.heatmap-section h3{font-size:12px;margin-bottom:8px;color:var(--text2)}
.heatmap{display:flex;flex-wrap:wrap;gap:2px}
.cell{width:11px;height:11px;border-radius:2px;background:var(--c1);position:relative;cursor:pointer}
.cell.l1{background:var(--c2)}
.cell.l2{background:var(--c3)}
.cell.l3{background:var(--c4)}
.cell.l4{background:var(--c5)}
.cell:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:3px 8px;border-radius:4px;font-size:10px;white-space:nowrap;z-index:20;pointer-events:none;border:1px solid var(--border)}

/* Histogram */
.histo-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.histo-section h3{font-size:12px;margin-bottom:12px;color:var(--text2)}
.histo-chart{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--border);padding-bottom:2px;overflow-x:auto}
.histo-bar{min-width:16px;border-radius:3px 3px 0 0;position:relative;cursor:pointer}
.histo-bar:hover{opacity:.8}
.histo-bar .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--surface2);padding:4px 8px;border-radius:4px;font-size:10px;white-space:nowrap;z-index:10}
.histo-bar:hover .tip{display:block}
.histo-labels{display:flex;gap:2px;overflow-x:auto;margin-top:4px}
.histo-label{min-width:16px;text-align:center;font-size:9px;color:var(--text2)}
.histo-legend{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--text2)}
.histo-legend span{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:2px}

/* Aggregation timeline */
.agg-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.agg-section h3{font-size:12px;margin-bottom:12px;color:var(--text2)}
.agg-timeline{position:relative;padding-left:20px}
.agg-day{display:flex;gap:8px;margin-bottom:2px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)}
.agg-day:last-child{border-bottom:none}
.agg-date{color:var(--text2);width:80px;flex-shrink:0;font-family:monospace;font-size:11px}
.agg-bar-wrap{flex:1;display:flex;align-items:center;gap:8px}
.agg-bar{height:14px;border-radius:3px;display:flex;overflow:hidden}
.agg-bar-inbox{background:var(--orange);height:100%}
.agg-bar-upgraded{background:var(--green);height:100%}
.agg-count{font-size:11px;color:var(--text2);min-width:40px;text-align:right}

/* Memory list */
.mem-toolbar{display:flex;gap:10px;margin-bottom:12px;align-items:center}
.mem-search{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--text);font-size:13px;outline:none}
.mem-search:focus{border-color:var(--primary)}
.mem-filter{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-size:12px;cursor:pointer}
.mem-list{display:flex;flex-direction:column;gap:6px}
.mem-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 14px;cursor:pointer;transition:border-color .15s;display:flex;gap:12px}
.mem-item:hover{border-color:var(--primary)}
.mem-time{color:var(--text2);font-size:11px;font-family:monospace;width:70px;flex-shrink:0;padding-top:1px}
.mem-body{flex:1;min-width:0}
.mem-title{font-size:13px;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mem-meta{font-size:11px;color:var(--text2);display:flex;gap:8px;align-items:center}
.mem-tag{display:inline-block;background:var(--surface2);padding:1px 6px;border-radius:3px;font-size:10px;color:var(--primary)}
.mem-cat{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600}
.cat-knowledge{background:#1e3a5f;color:#6c8aff}
.cat-preferences{background:#3a1e5f;color:#a78bfa}
.cat-people{background:#1e5f3a;color:#4ade80}
.cat-decisions{background:#5f3a1e;color:#fbbf24}
.cat-lessons{background:#5f1e1e;color:#f87171}
.cat-project{background:#1e5f5f;color:#22d3ee}
.cat-inbox{background:#3a3a1e;color:#fbbf24}
.cat-soul{background:#5f1e5f;color:#e879f9}
.cat-character{background:#1e3a3a;color:#22d3ee}
.cat-date{background:#3a3a3a;color:#8b8fa8}
.cat-feedback{background:#5f4a1e;color:#fbbf24}
.cat-habits{background:#1e4a5f;color:#6c8aff}
.cat-skills{background:#1e5f2a;color:#4ade80}
.cat-reminders{background:#5f2a1e;color:#f87171}
.phase-inbox{color:var(--orange)}
.phase-organized{color:var(--green)}
.phase-processed{color:var(--text2)}
/* Plugin cards */
.plugin-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.plugin-card .pname{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.plugin-card .pdesc{font-size:11px;color:var(--text2);margin-top:4px}
.plugin-card .pstatus{font-size:10px;padding:2px 6px;border-radius:3px;margin-left:auto}
.pstatus-active{background:#1e3a5f;color:#6c8aff}
.pstatus-idle{background:var(--surface2);color:var(--text2)}
.entity-chip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.entity-chip .ename{color:var(--text)}
.entity-chip .ecount{color:var(--text2);font-size:10px}
.entity-chip .ekind{background:var(--primary);color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;text-transform:uppercase}


/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:90%;max-width:650px;max-height:80vh;overflow-y:auto;padding:20px;position:relative}
.modal-close{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer}
.modal-close:hover{color:var(--text)}
.modal h2{font-size:14px;margin-bottom:10px;padding-right:24px}
.field{margin-bottom:12px}
.field-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.field-value{font-size:13px;background:var(--surface2);padding:8px 12px;border-radius:5px;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow-y:auto}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.row{display:flex;gap:12px}
.row>.field{flex:1}

.empty{color:var(--text2);text-align:center;padding:40px;font-size:14px}

/* Process panel */
.process-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px;display:none}
.process-panel.active{display:block}
.process-panel h3{font-size:12px;margin-bottom:8px;color:var(--text2);display:flex;align-items:center;gap:8px}
.process-panel h3 .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.process-msg{font-size:13px;margin-bottom:8px}
.process-log{max-height:150px;overflow-y:auto;font-size:11px;font-family:monospace;color:var(--text2);background:var(--surface2);padding:8px;border-radius:4px}
.process-log div{padding:1px 0;border-bottom:1px solid var(--border)}
.process-log div:last-child{border:none}
.process-stats{display:flex;gap:12px;margin-top:8px;font-size:12px}
.process-stats span{color:var(--text2)}
.process-stats strong{color:var(--text)}
</style>
</head>
<body>

<div class="nav">
  <h1><span>M</span>emory</h1>
  <div class="nav-tabs">
    <button class="nav-tab active" data-page="overview" onclick="showPage('overview',this)">Overview</button>
    <button class="nav-tab" data-page="inbox" onclick="showPage('inbox',this)">Inbox</button>
    <button class="nav-tab" data-page="longterm" onclick="showPage('longterm',this)">Long-term</button>
    <button class="nav-tab" data-page="processed" onclick="showPage('processed',this)">Processed</button>
    <button class="nav-tab" data-page="histogram" onclick="showPage('histogram',this)">Histogram</button>
    <button class="nav-tab" data-page="agg" onclick="showPage('agg',this)">Aggregation</button>
    <button class="nav-tab" data-page="plugins" onclick="showPage('plugins',this)">Plugins</button>
  </div>
  <div style="flex:1"></div>
  <span id="nav-status"><span class="dot dot-green"></span>OK</span>
</div>

<div class="main">
  <!-- Overview -->
  <div class="page active" id="page-overview">
    <div class="status-bar" id="status"></div>
    <div class="process-panel" id="process-panel">
      <h3><div class="pulse"></div> Processing Pipeline</h3>
      <div class="process-msg" id="process-msg">Idle</div>
      <div class="process-stats" id="process-stats"></div>
      <div class="process-log" id="process-log"></div>
    </div>
    <div class="heatmap-section">
      <h3>Activity (365 days)</h3>
      <div class="heatmap" id="heatmap"></div>
    </div>
  </div>

  <!-- Inbox (短期记忆) -->
  <div class="page" id="page-inbox">
    <div class="mem-toolbar">
      <input class="mem-search" id="inbox-search" placeholder="Search inbox..." onkeydown="if(event.key==='Enter'){inboxPage=1;loadInbox()}">
      <select class="mem-filter" id="inbox-cat" onchange="inboxPage=1;loadInbox()">
        <option value="">All</option><option value="knowledge">Knowledge</option><option value="people">People</option>
        <option value="project">Project</option><option value="preferences">Preferences</option>
        <option value="decisions">Decisions</option><option value="lessons">Lessons</option>
      </select>
    </div>
    <div class="mem-list" id="inbox-list"></div>
  </div>

  <!-- Long-term (长期记忆) -->
  <div class="page" id="page-longterm">
    <div class="mem-toolbar">
      <input class="mem-search" id="lt-search" placeholder="Search long-term..." onkeydown="if(event.key==='Enter'){ltPage=1;loadLT()}">
      <select class="mem-filter" id="lt-cat" onchange="ltPage=1;loadLT()">
        <option value="">All</option><option value="knowledge">Knowledge</option><option value="people">People</option>
        <option value="project">Project</option><option value="preferences">Preferences</option>
        <option value="decisions">Decisions</option><option value="lessons">Lessons</option>
        <option value="soul">Soul</option><option value="character">Character</option>
        <option value="habits">Habits</option><option value="skills">Skills</option>
      </select>
      <select class="mem-filter" id="lt-source" onchange="ltPage=1;loadLT()">
        <option value="">All Sources</option><option value="claude">Claude</option><option value="logseq">Logseq</option>
        <option value="car-agent">Car-Agent</option><option value="fingersaver">FingerSaver</option>
        <option value="http">HTTP</option><option value="manual">Manual</option>
      </select>
    </div>
    <div class="mem-list" id="lt-list"></div>
  </div>

  <!-- Processed (已处理原始记忆) -->
  <div class="page" id="page-processed">
    <div class="mem-toolbar">
      <input class="mem-search" id="proc-search" placeholder="Search processed..." onkeydown="if(event.key==='Enter'){procPage=1;loadProcessed()}">
      <select class="mem-filter" id="proc-cat" onchange="procPage=1;loadProcessed()">
        <option value="">All</option><option value="knowledge">Knowledge</option><option value="people">People</option>
        <option value="project">Project</option><option value="preferences">Preferences</option>
        <option value="conversations">Conversations</option><option value="claude">Claude</option>
        <option value="fingersaver">FingerSaver</option><option value="car-agent">Car-Agent</option>
      </select>
      <select class="mem-filter" id="proc-source" onchange="procPage=1;loadProcessed()">
        <option value="">All Sources</option><option value="claude">Claude</option><option value="conversations">Conversations</option>
        <option value="car-agent">Car-Agent</option><option value="fingersaver">FingerSaver</option>
        <option value="logseq">Logseq</option><option value="obsidian">Obsidian</option>
      </select>
    </div>
    <div class="mem-list" id="proc-list"></div>
  </div>

  <!-- Histogram -->
  <div class="page" id="page-histogram">
    <div class="histo-section">
      <h3>Daily Memory Count (last 90 days)</h3>
      <div id="histo-chart" class="histo-chart"></div>
      <div id="histo-labels" class="histo-labels"></div>
      <div class="histo-legend">
        <span><div class="legend-dot" style="background:var(--primary)"></div> Total memories</span>
        <span><div class="legend-dot" style="background:var(--orange)"></div> Inbox created</span>
        <span><div class="legend-dot" style="background:var(--green)"></div> Upgraded to long-term</span>
      </div>
    </div>
  </div>

  <!-- Aggregation Timeline -->
  <div class="page" id="page-agg">
    <div class="agg-section">
      <h3>Aggregation Timeline — inbox → long-term conversion</h3>
      <div id="agg-timeline" class="agg-timeline"></div>
    </div>
  </div>
</div>


  <!-- Plugins -->
  <div class="page" id="page-plugins">
    <div class="status-bar" id="plugin-status"></div>
    <div style="display:flex;gap:16px;margin-top:16px">
      <div style="flex:1">
        <h3 style="font-size:13px;color:var(--text2);margin-bottom:10px">Components</h3>
        <div id="comp-list"></div>
      </div>
      <div style="flex:1">
        <h3 style="font-size:13px;color:var(--text2);margin-bottom:10px">Processors</h3>
        <div id="proc-list"></div>
      </div>
      <div style="flex:1">
        <h3 style="font-size:13px;color:var(--text2);margin-bottom:10px">Ingest Sources</h3>
        <div id="ingest-list"></div>
      </div>
    </div>
    <div style="margin-top:20px">
      <h3 style="font-size:13px;color:var(--text2);margin-bottom:10px">Entity Graph (Top Entities)</h3>
      <div id="entity-graph" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
  </div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
let inboxPage=1, ltPage=1;

let procPage=1;
async function loadProcessed(){
  const q=document.getElementById('proc-search').value;
  const cat=document.getElementById('proc-cat').value;
  const src=document.getElementById('proc-source').value;
  let url=`/memories?phase=processed&limit=${PS}`;
  if(q) url+=`&q=${encodeURIComponent(q)}`;
  if(cat) url+=`&category=${cat}`;
  if(src) url+=`&source=${src}`;
  try{
    const r=await fetch(url);
    const d=await r.json();
    renderMemList('proc-list',d.memories||[],false);
  }catch(e){document.getElementById('proc-list').innerHTML='<p class="empty">Failed to load</p>';}
}


const PS=30;

function showPage(name,btn){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
  if(name==='inbox') loadInbox();
  if(name==='longterm') loadLT();
  if(name==='processed') loadProcessed();
  if(name==='histogram') loadHisto();
  if(name==='agg') loadAgg();
  if(name==='plugins') loadPlugins();
}

async function loadInbox(){
  const q=document.getElementById('inbox-search').value;
  const cat=document.getElementById('inbox-cat').value;
  let url=`/memories?phase=inbox&limit=${PS}`;
  if(q) url+=`&q=${encodeURIComponent(q)}`;
  if(cat) url+=`&category=${cat}`;
  try{
    const r=await fetch(url);
    const d=await r.json();
    renderMemList('inbox-list',d.memories||[],true);
  }catch(e){document.getElementById('inbox-list').innerHTML='<p class="empty">Failed to load</p>';}
}

async function loadLT(){
  const q=document.getElementById('lt-search').value;
  const cat=document.getElementById('lt-cat').value;
  const src=document.getElementById('lt-source').value;
  let url=`/memories?phase=organized&limit=${PS}`;
  if(q) url+=`&q=${encodeURIComponent(q)}`;
  if(cat) url+=`&category=${cat}`;
  if(src) url+=`&source=${src}`;
  try{
    const r=await fetch(url);
    const d=await r.json();
    renderMemList('lt-list',d.memories||[],false);
  }catch(e){document.getElementById('lt-list').innerHTML='<p class="empty">Failed to load</p>';}
}

function renderMemList(elId,mems,isInbox){
  const el=document.getElementById(elId);
  if(!mems.length){el.innerHTML=`<p class="empty">No ${isInbox?'inbox':'long-term'} memories</p>`;return;}
  el.innerHTML=mems.map(m=>{
    const t=m.created_at?new Date(m.created_at):null;
    const ts=t?t.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})+'<br>'+t.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="mem-item" onclick="openDetail('${m.id}')">
      <div class="mem-time">${ts}</div>
      <div class="mem-body">
        <div class="mem-title">${esc(m.content)}</div>
        <div class="mem-meta">
          <span class="mem-cat cat-${m.category}">${m.category}</span>
          ${(m.tags||[]).slice(0,5).map(t=>`<span class="mem-tag">${esc(t)}</span>`).join('')}
          <span style="color:var(--text2);font-size:10px;margin-left:auto">${esc(m.source)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function openDetail(id){
  try{
    const r=await fetch('/memories/'+id);
    if(!r.ok) throw new Error('not found');
    const m=await r.json();
    document.getElementById('modal-content').innerHTML=`
      <h2>${esc(m.content.slice(0,100))}</h2>
      <div class="field"><div class="field-label">Content</div><div class="field-value">${esc(m.content)}</div></div>
      <div class="row">
        <div class="field"><div class="field-label">Phase</div><div><span class="phase-${m.phase}">${m.phase}</span></div></div>
        <div class="field"><div class="field-label">Category</div><div><span class="mem-cat cat-${m.category}">${m.category}</span></div></div>
        <div class="field"><div class="field-label">Source</div><div style="font-size:13px">${esc(m.source)}</div></div>
        <div class="field"><div class="field-label">Scope</div><div style="font-size:13px">${esc(m.scope)}</div></div>
      </div>
      <div class="row">
        <div class="field"><div class="field-label">Created</div><div style="font-size:12px">${fmt(m.created_at)}</div></div>
        <div class="field"><div class="field-label">Updated</div><div style="font-size:12px">${fmt(m.updated_at)}</div></div>
        <div class="field"><div class="field-label">Access</div><div style="font-size:12px">${m.access_count||0} times</div></div>
        ${m.expires_at?`<div class="field"><div class="field-label">Expires</div><div style="font-size:12px">${fmt(m.expires_at)}</div></div>`:''}
      </div>
      ${m.tags&&m.tags.length?`<div class="field"><div class="field-label">Tags</div><div class="tags">${m.tags.map(t=>`<span class="mem-tag">${esc(t)}</span>`).join('')}</div></div>`:''}
      <div class="field"><div class="field-label">ID</div><div style="font-size:11px;color:var(--text2);font-family:monospace">${m.id}</div></div>
    `;
    document.getElementById('modal').classList.add('active');
  }catch(e){alert('Failed: '+e.message);}
}
function closeModal(){document.getElementById('modal').classList.remove('active')}

// Histogram
async function loadHisto(){
  try{
    const r=await fetch('/stats/histogram?days=90');
    const d=await r.json();
    const days=d.days||[];
    if(!days.length){document.getElementById('histo-chart').innerHTML='<p class="empty">No data yet</p>';return;}
    const max=Math.max(...days.map(d=>d.total||0),1);
    let bars='',labels='';
    for(const day of days){
      const h=Math.round((day.total||0)/max*110);
      const inboxH=day.inbox?Math.round(day.inbox/(day.total||1)*h):0;
      const upgradeH=day.upgraded?Math.round(day.upgraded/(day.total||1)*h):0;
      const baseH=h-inboxH-upgradeH;
      bars+=`<div class="histo-bar" style="height:${h}px;width:14px;display:flex;flex-direction:column;justify-content:flex-end">
        <div style="height:${upgradeH}px;background:var(--green);border-radius:2px 2px 0 0;min-height:${upgradeH?2:0}px"></div>
        <div style="height:${inboxH}px;background:var(--orange);min-height:${inboxH?2:0}px"></div>
        <div style="height:${Math.max(baseH,0)}px;background:var(--primary);min-height:${baseH?2:0}px"></div>
        <div class="tip">${day.date}: ${day.total} total (${day.inbox||0} inbox, ${day.upgraded||0} upgraded)</div>
      </div>`;
      const dt=new Date(day.date);
      labels+=`<div style="min-width:14px;text-align:center;font-size:8px;color:var(--text2)">${dt.getDate()}</div>`;
    }
    document.getElementById('histo-chart').innerHTML=bars;
    document.getElementById('histo-labels').innerHTML=labels;
  }catch(e){
    document.getElementById('histo-chart').innerHTML='<p class="empty">Failed to load histogram. SQLite backend required.</p>';
  }
}

// Aggregation Timeline
async function loadAgg(){
  try{
    const r=await fetch('/stats/aggregation?days=30');
    const d=await r.json();
    const days=d.days||[];
    if(!days.length){document.getElementById('agg-timeline').innerHTML='<p class="empty">No data yet</p>';return;}
    const maxTotal=Math.max(...days.map(d=>(d.inbox||0)+(d.upgraded||0)),1);
    let html='';
    for(const day of days){
      const inbox=d.inbox||0;
      const upgraded=d.upgraded||0;
      const total=inbox+upgraded;
      const w=Math.round(total/maxTotal*100);
      const inboxW=total?Math.round(inbox/total*100):0;
      const upgradeW=total?Math.round(upgraded/total*100):0;
      if(total===0) continue;
      html+=`<div class="agg-day">
        <div class="agg-date">${day.date.slice(5)}</div>
        <div class="agg-bar-wrap">
          <div class="agg-bar" style="width:${w}%">
            <div class="agg-bar-inbox" style="width:${inboxW}%"></div>
            <div class="agg-bar-upgraded" style="width:${upgradeW}%"></div>
          </div>
          <div class="agg-count">+${total} <span style="color:var(--orange)">${inbox}in</span> <span style="color:var(--green)">${upgraded}up</span></div>
        </div>
      </div>`;
    }
    if(!html) html='<p class="empty">No aggregation activity in this period</p>';
    document.getElementById('agg-timeline').innerHTML=html;
  }catch(e){
    document.getElementById('agg-timeline').innerHTML='<p class="empty">Failed to load. SQLite backend required.</p>';
  }
}

// Overview
async function loadOverview(){
  try{
    const r=await fetch('/stats');
    const d=await r.json();
    document.getElementById('status').innerHTML=`
      <div class="status-card"><div class="label">Total</div><div class="value">${d.total||0}</div></div>
      <div class="status-card"><div class="label">Inbox</div><div class="value" style="color:var(--orange)">${d.inbox||0}</div></div>
      <div class="status-card"><div class="label">Long-term</div><div class="value" style="color:var(--green)">${d.organized||0}</div></div>
      <div class="status-card"><div class="label">Processed</div><div class="value" style="color:var(--text2)">${d.processed||0}</div></div>
      <div class="status-card"><div class="label">Categories</div><div class="value">${Object.keys(d.categories||{}).length}</div></div>`;
  }catch(e){}
  try{
    const r=await fetch('/activity/heatmap');
    const d=await r.json();
    const days=d.days||[];
    let html='';
    for(let i=0;i<365-days.length;i++) html+='<div class="cell"></div>';
    for(const day of days) html+=`<div class="cell l${day.level}" data-tip="${day.date}: ${day.count} activities"></div>`;
    document.getElementById('heatmap').innerHTML=html;
  }catch(e){document.getElementById('heatmap').innerHTML='<p style="color:var(--text2);font-size:12px">No activity data</p>';}
}

function esc(s){return s?(s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')):'';}
function fmt(ts){return ts?new Date(ts).toLocaleString('zh-CN'):'-';}


async function loadPlugins(){
  // Components
  try{
    const r=await fetch('/plugins/components');
    const d=await r.json();
    const el=document.getElementById('comp-list');
    if(d.components&&d.components.length){
      el.innerHTML=d.components.map(c=>`<div class="plugin-card">
        <div class="pname"><span class="dot dot-green"></span>${esc(c.name)} <span class="pstatus pstatus-active">${esc(c.data_type)}</span></div>
        <div class="pdesc">Decay: ${esc(c.decay_strategy||'none')} ${c.half_life?'('+c.half_life+')':''} | Schema: ${c.tables||0} tables</div>
      </div>`).join('');
    } else {
      el.innerHTML='<p class="empty">No components registered</p>';
    }
  }catch(e){document.getElementById('comp-list').innerHTML='<p class="empty">Failed to load</p>';}

  // Processors
  try{
    const r=await fetch('/plugins/processors');
    const d=await r.json();
    const el=document.getElementById('proc-list');
    if(d.processors&&d.processors.length){
      el.innerHTML=d.processors.map(p=>`<div class="plugin-card">
        <div class="pname"><span class="dot dot-green"></span>${esc(p.name)}</div>
        <div class="pdesc">Consumes: ${(p.consumes||[]).map(esc).join(', ')} &rarr; Produces: ${(p.produces||[]).map(esc).join(', ')}</div>
      </div>`).join('');
    } else {
      el.innerHTML='<p class="empty">No processors registered</p>';
    }
  }catch(e){document.getElementById('proc-list').innerHTML='<p class="empty">Failed to load</p>';}

  // Ingest sources
  try{
    const r=await fetch('/plugins/ingests');
    const d=await r.json();
    const el=document.getElementById('ingest-list');
    if(d.ingests&&d.ingests.length){
      el.innerHTML=d.ingests.map(i=>`<div class="plugin-card">
        <div class="pname">${esc(i.name)}</div>
      </div>`).join('');
    } else {
      el.innerHTML='<p class="empty">No ingest sources registered</p>';
    }
  }catch(e){document.getElementById('ingest-list').innerHTML='<p class="empty">Failed to load</p>';}

  // Entity graph
  try{
    const r=await fetch('/plugins/entities?limit=20');
    const d=await r.json();
    const el=document.getElementById('entity-graph');
    if(d.entities&&d.entities.length){
      el.innerHTML=d.entities.map(e=>`<div class="entity-chip">
        <span class="ekind">${esc(e.kind)}</span>
        <span class="ename">${esc(e.name)}</span>
        <span class="ecount">${e.mention_count||0} mentions</span>
      </div>`).join('');
    } else {
      el.innerHTML='<p class="empty">No entities yet</p>';
    }
  }catch(e){document.getElementById('entity-graph').innerHTML='<p class="empty">Entity component not active</p>';}
}

// SSE: real-time processor status
let processLog=[];
function connectSSE(){
  let es;
  function connect(){
    es=new EventSource('/process/events');
    es.onmessage=function(e){
      try{
        const ev=JSON.parse(e.data);
        updateProcessPanel(ev);
      }catch(err){}
    };
    es.onerror=function(){
      es.close();
      setTimeout(connect,5000);
    };
  }
  connect();
  // Also poll status every 10s as fallback
  setInterval(async()=>{
    try{
      const r=await fetch('/process/status');
      const s=await r.json();
      updateProcessPanel({type:'status',status:s});
    }catch(e){}
  },10000);
}
function updateProcessPanel(ev){
  const s=ev.status||{};
  const panel=document.getElementById('process-panel');
  const msg=document.getElementById('process-msg');
  const stats=document.getElementById('process-stats');
  const logEl=document.getElementById('process-log');
  if(s.running){
    panel.classList.add('active');
    msg.textContent=s.message||'Processing...';
    // Auto-refresh stats while processing
    loadOverview();
  }else if(ev.type==='done'){
    panel.classList.add('active');
    msg.textContent=s.message;
    loadOverview();
    setTimeout(()=>panel.classList.remove('active'),15000);
  }else{
    panel.classList.remove('active');
  }
  const p=s.progress||{};
  if(p.layer1_input>0||p.organized>0){
    stats.innerHTML=`<span>Inbox: <strong>${p.total_inbox||0}</strong></span>
      <span>L1: <strong>${p.layer1_input||0}→${p.layer1_output||0}</strong></span>
      <span>L2: <strong>${p.layer2_input||0}→${p.layer2_output||0}</strong></span>
      <span>Organized: <strong>${p.organized||0}</strong></span>
      <span>Processed: <strong>${p.processed||0}</strong></span>`;
  }
  if(ev.type==='log'||ev.type==='done'||ev.type==='error'){
    const ts=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    processLog.push(`[${ts}] ${ev.message}`);
    if(processLog.length>50) processLog=processLog.slice(-50);
    logEl.innerHTML=processLog.map(l=>`<div>${l}</div>`).join('');
    logEl.scrollTop=logEl.scrollHeight;
  }
}

loadOverview();
connectSSE();
// Refresh overview stats every 15s
setInterval(loadOverview,15000);
</script>
